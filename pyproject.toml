[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salix-rikai-kotoba"
dynamic = ["version"]
description = "Generic retro-disc localization and reverse-engineering toolkit, beginning with Sega Saturn"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Nadir Saleh" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "dearpygui>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
srk = "rikai_kotoba.cli:main"
srk-gui = "rikai_kotoba.desktop:main"
srk-mjolnir = "rikai_kotoba.tools.mjolnir:main"
srk-saroo-toolchain = "rikai_kotoba.tools.saroo_toolchain:main"

[tool.setuptools.dynamic]
version = { attr = "rikai_kotoba.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["rikai_kotoba*", "salix*"]
